<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ShadowGuard social preview</title>
  <desc id="desc">ShadowGuard, open-source self-hosted AI governance, created by RLS Solutions.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FCFAF7" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="icon-clip">
      <rect x="888" y="120" width="328" height="328" rx="72"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="#050505"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#grid)"/>
  <rect x="64" y="64" width="8" height="512" rx="4" fill="#FE6E00"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="127" fill="#FE6E00" font-size="22" font-weight="700" letter-spacing="3.5">APACHE-2.0 · SELF-HOSTED</text>
    <text x="108" y="279" fill="#FCFAF7" font-size="104" font-weight="700" letter-spacing="-4">ShadowGuard</text>
    <text x="112" y="353" fill="#C7C3BC" font-size="34" font-weight="400">Open-source AI governance. Self-hosted.</text>

    <line x1="112" y1="480" x2="784" y2="480" stroke="#FCFAF7" stroke-opacity="0.16"/>
    <text x="112" y="528" fill="#FCFAF7" font-size="24" font-weight="700">Created by RLS Solutions</text>
    <text x="112" y="562" fill="#8E8A83" font-size="20" font-weight="400" letter-spacing="0.8">rls-solutions.com</text>
  </g>

  <rect x="872" y="104" width="360" height="360" rx="84" fill="#FE6E00" fill-opacity="0.08" stroke="#FE6E00" stroke-opacity="0.3" stroke-width="2"/>
  <image href="shadowguard-helmet-icon.png" x="888" y="120" width="328" height="328" preserveAspectRatio="xMidYMid slice" clip-path="url(#icon-clip)"/>
  <text x="1052" y="520" text-anchor="middle" fill="#8E8A83" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4">AI GOVERNANCE</text>
</svg>
